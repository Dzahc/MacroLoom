[package]
name = "macroloom"
version = "0.1.0"
edition = "2021"

[lib]
name = "macroloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
input-prototype = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
sha2 = "=0.10.9"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_Threading"] }
